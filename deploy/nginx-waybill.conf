# Waybill WhatsApp API — nginx → Node on port 5001
#
# DNS: eway.examwale.co.in → 65.2.153.166 (A record)
# SSL: uses existing *.examwale.co.in wildcard cert on this server
#
# Install on EC2:
#
# Amazon Linux (ec2-user) — uses conf.d:
#   sudo cp deploy/nginx-waybill.conf /etc/nginx/conf.d/waybill.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ubuntu — uses sites-available:
#   sudo cp deploy/nginx-waybill.conf /etc/nginx/sites-available/waybill
#   sudo ln -sf /etc/nginx/sites-available/waybill /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    server_name eway.examwale.co.in;

    ssl_certificate     /etc/letsencrypt/live/examwale.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examwale.co.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name eway.examwale.co.in;
    return 301 https://$host$request_uri;
}
